# Ranný podcast – nastavenia
# Zmeny sa prejavia pri najbližšej vygenerovanej epizóde.

podcast:
  title: "Ranný brief"
  language: sk
  keep_episodes: 14          # koľko posledných epizód ostane vo feede

episode:
  max_words: 1300            # ≈ 9–10 minút
  lookback_hours: 24         # z akého obdobia brať správy
  model: gemini-3.8-flash    # zadarmo cez Google AI Studio
  fallback_model: gemini-3.7-flash

tts:
  voice: sk-SK-LukasNeural   # alternatíva: sk-SK-ViktoriaNeural
  rate: "+0%"                # rýchlosť reči, napr. "+10%"
  bitrate: 64k

topics:
  - name: "Apple – novinky a rumors"
    share: 0.40
    notes: "Rumors vždy označ ako rumors a uveď pôvodný zdroj (napr. Mark Gurman / Bloomberg)."
    feeds:
      - https://www.apple.com/newsroom/rss-feed.rss
      - https://feeds.macrumors.com/MacRumors-All
      - https://9to5mac.com/feed/

  - name: "Slovensko – politika a dôležité udalosti"
    share: 0.35
    google_news:
      query: "Slovensko vláda OR parlament OR politika"
      hl: sk
      gl: SK

  - name: "Vojna Rusko–Ukrajina"
    share: 0.25
    notes: "Vývoj na fronte, diplomacia, pomoc Ukrajine. Tvrdenia strán konfliktu uvádzaj s pripísaním."
    google_news:
      query: "Ukrajina Rusko vojna"
      hl: sk
      gl: SK
