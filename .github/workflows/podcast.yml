name: Ranný podcast

on:
  schedule:
    - cron: "30 3 * * *"   # UTC → 5:30 v lete, 4:30 v zime
  workflow_dispatch:
    inputs:
      focus:
        description: "Jednorazový dôraz (nepovinné)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: podcast
  cancel-in-progress: false

jobs:
  episode:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - id: pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r requirements.txt
      - name: Generovanie epizódy
        run: python generate.py
        env:
          FOCUS: ${{ inputs.focus }}
          RUN_KIND: ${{ github.event_name }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Udržať ranné spúšťanie aktívne
        continue-on-error: true
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/podcast.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
